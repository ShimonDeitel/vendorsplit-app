name: Vendorsplit
options:
  bundleIdPrefix: com.shimondeitel.potlucksplit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Vendorsplit:
    type: application
    platform: iOS
    sources:
      - path: Vendorsplit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potlucksplit
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Vendorsplit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  VendorsplitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VendorsplitTests
      - path: Vendorsplit.storekit
    dependencies:
      - target: Vendorsplit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potlucksplit.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  VendorsplitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VendorsplitUITests
    dependencies:
      - target: Vendorsplit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potlucksplit.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Vendorsplit:
    build:
      targets:
        Vendorsplit: all
        VendorsplitTests: [test]
        VendorsplitUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Vendorsplit.storekit
    test:
      config: Debug
      storeKitConfiguration: Vendorsplit.storekit
      targets:
        - VendorsplitTests
        - VendorsplitUITests
    archive:
      config: Release
